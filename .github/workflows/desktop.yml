name: Desktop

# Builds CodeVideo Studio for the desktop (Tauri) with everything it runs
# bundled: Node, Chrome for Testing, FFmpeg, the CodeVideo CLI and Kokoro
# speech (scripts/desktop/runtime.lock.json pins them all). macOS (Apple
# silicon) gets a DMG; Windows (x64) gets an MSI and a setup.exe.
#
# - A version tag (v1.0.0) builds that version and drafts a GitHub release with
#   the installers. The tag must match package.json, which is also the version
#   the web studio's footer shows, so web and desktop always agree.
# - A manual run builds any branch; its files are named <version>-dev.<commit>.
#
# This workflow is separate from Netlify's deploy of the web studio: a desktop
# failure never blocks the website.
#
# Builds are unsigned for now (ad-hoc signed on macOS). See docs/desktop.md for
# opening them and for adding signing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check the version
        run: |
          version=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$cargo" != "$version" ]; then
            echo "::error file=src-tauri/Cargo.toml::Cargo.toml has version $cargo, package.json has $version. Keep them equal."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag $GITHUB_REF_NAME doesn't match package.json's version $version. Tag v$version, or bump package.json first."
              exit 1
            fi
            name=$version
          else
            name=$version-dev.${GITHUB_SHA::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building CodeVideo Studio $name"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Intel Macs follow once runtime.lock.json pins their Chrome and FFmpeg.
          - platform: macos-arm64
            runner: macos-15
            bundles: app
          - platform: windows-x64
            runner: windows-2025
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Node 24, bundled, needs macOS 13.5 (Windows ignores this).
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned sources
        id: pins
        run: |
          node -e '
            const lock = require("./scripts/desktop/runtime.lock.json");
            const out = require("fs").createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
            for (const [key, value] of Object.entries({
              cli_repository: lock.cli.repository, cli_commit: lock.cli.commit,
              tts_repository: lock.tts.repository, tts_commit: lock.tts.commit, tts_path: lock.tts.path,
            })) out.write(`${key}=${value}\n`);
          '

      - name: Check out codevideo-cli at its pinned commit
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.cli_repository }}
          ref: ${{ steps.pins.outputs.cli_commit }}
          path: .desktop-src/codevideo-cli
          persist-credentials: false

      - name: Check out codevideo-tts at its pinned commit
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pins.outputs.tts_repository }}
          ref: ${{ steps.pins.outputs.tts_commit }}
          path: .desktop-src/codevideo-api
          sparse-checkout: ${{ steps.pins.outputs.tts_path }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: .desktop-src/codevideo-cli/go.mod
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Downloads and the FFmpeg build (several minutes), until a pin changes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/codevideo-desktop
          key: desktop-runtime-${{ matrix.platform }}-${{ hashFiles('scripts/desktop/runtime.lock.json', 'scripts/desktop/build-ffmpeg.sh') }}

      - run: npm ci

      - name: Assemble the bundled runtime
        run: >
          node scripts/desktop/prepare-runtime.mjs
          --cli-src .desktop-src/codevideo-cli
          --tts-src .desktop-src/codevideo-api/${{ steps.pins.outputs.tts_path }}

      - name: Speak and render with the runtime, with the network off (macOS)
        if: runner.os == 'macOS'
        run: sandbox-exec -f scripts/desktop/offline.sb node scripts/desktop/smoke-runtime.mjs

      # Windows has no sandbox-exec, so firewall rules block every bundled
      # program from the network instead. The firewall doesn't filter loopback,
      # so the CLI still reaches its own local servers.
      - name: Speak and render with the runtime, with the network off (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = (Resolve-Path src-tauri/runtime).Path
          $paths = (Get-Content "$runtime/manifest.json" -Raw | ConvertFrom-Json).paths
          Set-NetFirewallProfile -All -Enabled True -DefaultOutboundAction Allow
          foreach ($key in 'node', 'chrome', 'ffmpeg', 'ffprobe', 'cli') {
            $program = [System.IO.Path]::GetFullPath((Join-Path $runtime $paths.$key))
            New-NetFirewallRule -DisplayName "CodeVideo offline: $key" -Direction Outbound -Action Block -Program $program | Out-Null
          }
          # Check the rules work: the bundled Node must not reach the internet.
          $node = [System.IO.Path]::GetFullPath((Join-Path $runtime $paths.node))
          & $node -e "fetch('https://example.com').then(() => process.exit(1), () => process.exit(0))"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::The bundled Node reached the internet, so the firewall rules don't work"
            exit 1
          }
          node scripts/desktop/smoke-runtime.mjs

      - name: Build the app
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Check the app's version (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shown=$(plutil -extract CFBundleShortVersionString raw "src-tauri/target/release/bundle/macos/CodeVideo Studio.app/Contents/Info.plist")
          if [ "$shown" != "$VERSION" ]; then
            echo "::error::The app says it's version $shown, expected $VERSION"
            exit 1
          fi

      # Tauri's resource copy would break Chrome's framework symlinks, so the
      # runtime goes in afterwards (ditto), then the app is signed again.
      - name: Add the runtime and make the disk image (macOS)
        if: runner.os == 'macOS'
        run: >
          bash scripts/desktop/package-macos.sh
          "src-tauri/target/release/bundle/macos/CodeVideo Studio.app"
          src-tauri/runtime
          "dist/CodeVideo-Studio-${{ needs.version.outputs.name }}-${{ matrix.platform }}-unsigned.dmg"

      # On Windows the runtime is one of Tauri's resources (tauri.windows.conf.json),
      # since there are no symlinks to break, so both installers already hold it.
      - name: Check the app's version and collect the installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          $release = "src-tauri/target/release"
          $shown = (Get-Item "$release/codevideo-studio.exe").VersionInfo.ProductVersion
          if ((($shown -split '\.')[0..2] -join '.') -ne $env:VERSION) {
            Write-Output "::error::The app says it's version $shown, expected $env:VERSION"
            exit 1
          }
          $msi = @(Get-ChildItem "$release/bundle/msi/*_$($env:VERSION)_x64_*.msi")
          $setup = @(Get-ChildItem "$release/bundle/nsis/*_$($env:VERSION)_x64-setup.exe")
          if ($msi.Count -ne 1 -or $setup.Count -ne 1) {
            Write-Output "::error::Expected one MSI and one setup.exe for $env:VERSION, found: $($msi.Name) $($setup.Name)"
            exit 1
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $msi[0].FullName "dist/CodeVideo-Studio-$($env:NAME)-${{ matrix.platform }}-unsigned.msi"
          Copy-Item $setup[0].FullName "dist/CodeVideo-Studio-$($env:NAME)-${{ matrix.platform }}-unsigned-setup.exe"
          Get-ChildItem dist | ForEach-Object { "{0} ({1:N0} MB)" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v7
        with:
          name: codevideo-studio-${{ needs.version.outputs.name }}-${{ matrix.platform }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  # Installs what users download on a fresh Windows machine, one installer per
  # machine: each looks for the other's earlier install (Tauri keeps the folder
  # in HKCU\Software\<publisher>\<product>) and would reuse its folder. Then it
  # speaks and renders from the install folder. The MSI's is in Program Files,
  # which has a space in it and isn't writable by normal users.
  windows-installers:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        installer: [setup, msi]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: codevideo-studio-${{ needs.version.outputs.name }}-windows-x64
          path: dist

      - name: Install with the ${{ matrix.installer }} installer
        shell: pwsh
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          if ($env:INSTALLER -eq 'msi') {
            $file = (Get-ChildItem dist/*.msi)[0].FullName
            $p = Start-Process msiexec.exe -ArgumentList "/i `"$file`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
            $dir = "$env:ProgramFiles\CodeVideo Studio"
          } else {
            $file = (Get-ChildItem dist/*-setup.exe)[0].FullName
            $p = Start-Process $file -ArgumentList '/S' -Wait -PassThru
            $dir = "$env:LOCALAPPDATA\CodeVideo Studio"
          }
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$env:RUNNER_TEMP\install.log") { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 40 }
            Write-Output "::error::$(Split-Path $file -Leaf) exited with $($p.ExitCode)"
            exit 1
          }
          if (-not (Test-Path "$dir\runtime\manifest.json")) {
            Write-Output "::error::$(Split-Path $file -Leaf) didn't put the runtime in $dir"
            exit 1
          }
          Write-Output "Installed into $dir"
          "INSTALL_DIR=$dir" >> $env:GITHUB_ENV

      - name: Speak and render from the install
        shell: pwsh
        run: node scripts/desktop/smoke-runtime.mjs --runtime "$env:INSTALL_DIR\runtime"

      # CI can't click through the app, but a screenshot shows whether the
      # editor comes up in WebView2.
      - name: Open the installed app and take a screenshot
        shell: pwsh
        run: |
          $dir = $env:INSTALL_DIR
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) {
            Write-Output "::error::$($exe.Name) exited right away with $($app.ExitCode)"
            exit 1
          }
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force screenshots | Out-Null
            $bitmap.Save("$PWD\screenshots\windows-app.png", [System.Drawing.Imaging.ImageFormat]::Png)
          } catch {
            Write-Output "::warning::No screenshot: $_"
          }
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshot-${{ needs.version.outputs.name }}-${{ matrix.installer }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [version, build, windows-installers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: codevideo-studio-*
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="CodeVideo Studio $VERSION for the desktop: the editor, with Kokoro speech and video renders on your computer, no account or network needed.

          - macOS (Apple silicon, macOS 13.5 or later): the .dmg
          - Windows (x64): the -setup.exe installs for your user, without admin rights. The .msi installs for every user on the PC, for IT departments.

          These builds are not signed yet:
          - macOS: after copying the app to Applications, run: xattr -dr com.apple.quarantine \"/Applications/CodeVideo Studio.app\"
          - Windows: if SmartScreen says \"Windows protected your PC\", choose More info, then Run anyway."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --title "CodeVideo Studio $VERSION" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
