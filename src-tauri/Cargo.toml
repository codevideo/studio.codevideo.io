[package]
name = "codevideo-studio"
# The app's version comes from ../package.json (tauri.conf.json "version").
# Keep this one equal to it: the desktop workflow checks both against the tag.
version = "1.0.0"
description = "CodeVideo Studio desktop app"
authors = ["Full Stack Craft"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
